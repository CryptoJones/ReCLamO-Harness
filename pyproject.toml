[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reclamo"
version = "0.1.0.dev0"
description = "Recursive Language Model (RLM) harness tuned for Qwen served by Strata on pluto"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Aaron K. Clark" }]
keywords = ["rlm", "recursive-language-model", "llm", "qwen", "harness"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/CryptoJones/ReCLamO-Harness"
Issues = "https://github.com/CryptoJones/ReCLamO-Harness/issues"

[project.scripts]
reclamo = "reclamo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reclamo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that call a real model endpoint (pluto); skipped by default, run with -m live",
    "docker: tests that need a working Docker daemon; they skip themselves when it is absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Third-party eval generators are kept byte-for-byte as their authors wrote them.
extend-exclude = ["evals/independent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
